name: abastecimento_vipe
description: "App offline-first do sistema Abastecimento Vipe (sincroniza com backend Laravel na Vercel)."
publish_to: 'none'
version: 2.0.51+6030

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP + JSON
  http: ^1.2.2

  # Offline / persistencia
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # UI util
  intl: ^0.20.2
  fl_chart: ^1.2.0

  # Captura de foto / arquivos
  file_picker: ^12.0.0-beta.7
  archive: ^4.0.9
  xml: ^6.6.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.0

  # Notificação local (novo abastecimento para admins)
  flutter_local_notifications: ^18.0.1

  # Formatacao de moeda / input
  mask_text_input_formatter: ^2.9.0

  # Detecta mudanca de conectividade (dispara sync ao voltar internet)
  connectivity_plus: ^7.2.0
  open_filex: ^4.7.0
  image: ^4.8.0

  # Mantém tela ligada durante operações longas (abastecimento)
  wakelock_plus: ^1.1.4

  # Compartilhamento de arquivos / comprovantes
  receive_sharing_intent: ^1.8.1
  workmanager: ^0.10.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
