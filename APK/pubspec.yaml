name: abastecimento_vipe
description: "App offline-first do sistema Abastecimento Vipe (sincroniza com backend Laravel na Vercel)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP + JSON
  http: ^1.2.2

  # Offline / persistencia
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # UI util
  intl: ^0.20.2
  fl_chart: ^0.69.0

  # Captura de foto / arquivos
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # Formatacao de moeda / input
  mask_text_input_formatter: ^2.9.0

  # Detecta mudanca de conectividade (dispara sync ao voltar internet)
  connectivity_plus: ^6.0.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
